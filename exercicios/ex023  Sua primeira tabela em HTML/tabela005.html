<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
    }
    table {
        border-collapse: collapse;
    }
    th, td {
        border: 1px solid black;
        padding: 10px;
        width: 120px;
        text-align: center;
    }
    caption {
        font-weight: bolder;
        font-size: 1.2em;
    }
    col.csexo, .cprofissao {
        background-color: darkgray;
    }
</style>
<body>
    <h1>Exercicio</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprofissao">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Valterlan</td>
            <td>M</td>
            <td>24</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Marilene</td>
            <td>F</td>
            <td>49</td>
            <td>Dona de Casa</td>
        </tr>
        <tr>
            <td>Bruno</td>
            <td>M</td>
            <td>38</td>
            <td>Eletricista</td>
        </tr>
        <tr>
            <td>Alex</td>
            <td>M</td>
            <td>21</td>
            <td>Predeiro</td>
        </tr>
        <tr>
            <td>Laura</td>
            <td>F</td>
            <td>26</td>
            <td>Médica</td>
        </tr>
        <tr>
            <td>Leticia</td>
            <td>F</td>
            <td>31</td>
            <td>Dentista</td>
        </tr>
    </table>
</body>
</html>
