<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkbox e radio</title>
</head>
<body>
    <h1>Listas</h1>
    <form action="cadastro.python" method="get">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="masc"> <label for="masc">Masculino</label>
            <input type="radio" name="sexo" id="femi"> <label for="femi">Feminino</label>
            <input type="radio" name="sexo" id="outro"> <label for="outro">Outro</label>
        </fieldset>
        <fieldset>
            <legend>Estilos de Jogos</legend>
            <input type="checkbox" name="acao" id="aacao"> <label for="aacao">Ação</label> <br>
            <input type="checkbox" name="aventura" id="aaventura"> <label for="aaventura">Aventura</label> <br>
            <input type="checkbox" name="mmorpg" id="ammorpg"> <label for="ammorpg">MMORPG</label> <br>
            <input type="checkbox" name="luta" id="aluta"> <label for="aluta">Lutas</label> <br>
            <input type="checkbox" name="corrida" id="acorrida"> <label for="acorrida">Corridas</label> <br>
            <input type="checkbox" name="terror" id="aterror"> <label for="aterror">Terror</label> <br>
            <input type="checkbox" name="mediavel" id="amediavel"> <label for="amediavel">Mediavel</label> <br>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
