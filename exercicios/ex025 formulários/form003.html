<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Adicionando formulário</h1>
    <form action="cadastro.python" method="get" autocomplete="on">
        <p>
            <label for="umusu">Nome:</label>
            <input type="text" name="name" id="umsu" autocomplete="name" maxlength="30" placeholder="Nome Completo">
        </p>
        <p>
            <label for="umame">Média</label>
            <input type="number" name="media" id="umame" min="0" max="10" step="0.5" required>
        </p>
        <p>
            <label for="ummes">Mês letivo</label>
            <input type="month" name="mes" id="ummes" required>
        </p>
        <p>
            <label for="umdia">Dia</label>
            <input type="date" name="dia" id="umdia">
        </p>
        <p>
            <label for="umahora">Horário</label>
            <input type="time" name="hora" id="umahora">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
