<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.python" method="post" autocomplete="on">
        <p>
            <label for="umsu">Usuário: </label>
            <input type="text" name="usu" id="umsu" required minlength="5" maxlength="15" placeholder="Nome do Usuário" autocomplete="username">
        </p>
        <p>
            <label for="umase">Senha: </label>
            <input type="password" name="sen" id="umase" required minlength="6" placeholder="Senha do Usuário" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
