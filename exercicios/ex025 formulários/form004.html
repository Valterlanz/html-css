<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste</title>
</head>
<body>
    <h1>Teste de email e telefone</h1>
    <form action="cadastro" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="umnome">Nome: </label>
                <input type="text" name="name" id="umnome" placeholder="Seu nome">
            </p>
            <p>
                <label for="umemail">E-mail: </label>
                <input type="email" name="email" id="umemail" required placeholder="Seu email">
            </p>
            <p>
                <label for="umtel">Telefone: </label>
                <input type="tel" name="tel" id="umtel" required pattern="^\(\d{2}\)\d{4,5}-\d{4}$" placeholder="(xx)xxxxx-xxxx">
            </p>
        </fieldset>
        <p>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </p>

    </form>
</body>
</html>
