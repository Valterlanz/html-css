<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulários</title>
</head>
<body>
    <h1>teste de formulário</h1>
    <form action="cadastro.py" method="post">
        <p>
            <label for="acor">Cor: </label>
            <input type="color" name="color" id="acor">
        </p>
        <p>
            <label for="asat">Nivel de Satisfação: </label>
            <input type="range" name="range" id="asat" min="1" max="5">
        </p>
        <p>
            <label for="afoto">Foto: </label>
            <input type="file" name="foto" id="afoto">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
