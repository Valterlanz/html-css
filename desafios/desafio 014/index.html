<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tabela de Notas</title>
    <style>
        body {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
        table {
            border-collapse: collapse;
        }
        /* Corrigido: sem vírgula no 1px */
        tr, th, td {
            border: 1px solid black;
            padding: 10px;
        }
        /* Centraliza o conteúdo de TODAS as células de dados por padrão */
        td {
            text-align: center;
        }
        .area {
            background-color: gray;
        }
        /* Classe para alinhar os títulos de "Médias de..." à esquerda */
        .esquerda {
            text-align: left;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" class="area">Área</th>
                <th rowspan="2" class="area">Disciplina</th>
                <th colspan="2" class="area">Notas</th>
                <th rowspan="2" class="area">Média</th>
            </tr>
            <tr>
                <th class="area">Nota 1</th>
                <th class="area">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <!-- Aplica a classe .esquerda no TH -->
            <tr class="area"> 
                <th colspan="4" class="esquerda">Médias de Exatas</th>
                <td>0.0</td> <!-- Já fica centralizado pelo CSS geral -->
            </tr>
            <tr>
                <th rowspan="2">Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <!-- Corrigido: adicionada a <tr> que faltava -->
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr class="area"> 
                <th colspan="4" class="esquerda">Médias de Humanas</th>
                <td>0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
